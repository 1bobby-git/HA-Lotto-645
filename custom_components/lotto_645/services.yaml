refresh:
  name: Refresh data and regenerate numbers
  description: Recheck the shared Lotto history and request new numbers for every selected non-AI formula from the Lotto Lab service. The AI recommendation is not regenerated. When the service is turned off or unreachable, the saved numbers are kept.

generate_ai_recommendation:
  name: Generate Home Assistant AI recommendation
  description: Generate and validate one recommendation using a Home Assistant data-generation AI Task.
  fields:
    entity_id:
      name: AI Task entity
      description: Optional AI Task entity. Leave blank to use the preferred data-generation AI Task configured in Home Assistant Settings > AI.
      required: false
      selector:
        entity:
          domain: ai_task
