refresh:
  name: Refresh data and regenerate local numbers
  description: Refresh the shared Lotto history and regenerate every selected non-AI recommendation from a different high-scoring candidate. The AI recommendation is not regenerated.

generate_ai_recommendation:
  name: Generate Home Assistant AI recommendation
  description: Generate and validate one recommendation using a Home Assistant data-generation AI Task.
  fields:
    entity_id:
      name: AI Task entity
      description: Optional AI Task entity. Leave blank to use the preferred data-generation AI Task configured in Home Assistant Settings > AI.
      required: false
      selector:
        entity:
          domain: ai_task
