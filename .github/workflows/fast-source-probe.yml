name: Fast Source Probe
on:
  push:
    branches: [feat/v1.10.0-fast-results-qr]
    paths: [.github/workflows/fast-source-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch allowed RSS and pinned open-source QR decoder
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.robotparser, urllib.error
          import hashlib, base64, tarfile, io
          from pathlib import Path
          root=Path('/tmp/lotto-probe');root.mkdir()
          targets={
            'sbs_economy':'https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=02&plink=RSSREADER',
            'sbs_latest':'https://news.sbs.co.kr/news/newsflashRssFeed.do?plink=RSSREADER',
            'yna_economy':'https://www.yna.co.kr/rss/economy.xml',
          }
          ua='HA-Lotto-645/1.10 (+https://github.com/1bobby-git/HA-Lotto-645)'
          results=[];robots_cache={}
          for name,url in targets.items():
            row={'name':name,'url':url}
            try:
              parts=urllib.parse.urlsplit(url);host=parts.netloc
              if host not in robots_cache:
                robots_url=f'https://{host}/robots.txt'
                with urllib.request.urlopen(urllib.request.Request(robots_url,headers={'User-Agent':ua}),timeout=12) as r:
                  text=r.read(256000).decode('utf-8','replace')
                rp=urllib.robotparser.RobotFileParser();rp.parse(text.splitlines());robots_cache[host]=rp
              if not robots_cache[host].can_fetch(ua,url):
                row['status']='disallowed'
              else:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=12) as r:
                  raw=r.read(2000001);row['status']=r.status
                if len(raw)>2000000:raise ValueError('too large')
                root.joinpath(name+'.xml').write_bytes(raw)
            except Exception as e:row['error']=str(e)
            results.append(row)
          with urllib.request.urlopen('https://registry.npmjs.org/jsqr/1.4.0',timeout=15) as r:
            meta=json.load(r)
          with urllib.request.urlopen(meta['dist']['tarball'],timeout=15) as r:raw=r.read(2000000)
          assert 'sha512-'+base64.b64encode(hashlib.sha512(raw).digest()).decode()==meta['dist']['integrity']
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
            for src,dst in [('package/dist/jsQR.js','jsQR.js'),('package/LICENSE','LICENSE-jsQR')]:
              root.joinpath(dst).write_bytes(tf.extractfile(src).read())
          root.joinpath('qr-decoder-pin.json').write_text(json.dumps({'version':'1.4.0','integrity':meta['dist']['integrity'],'sha256':hashlib.sha256(root.joinpath('jsQR.js').read_bytes()).hexdigest()},indent=2))
          root.joinpath('fetch-report.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fast-source-probe
          path: /tmp/lotto-probe/
          retention-days: 1
