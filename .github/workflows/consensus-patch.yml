name: Consensus patch workspace
on:
  push:
    branches: [fix/reactive-consensus-1.12.1]
    paths: [.github/workflows/consensus-patch.yml]
permissions:
  contents: read
jobs:
  validate-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply source patch with exact baseline and result verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path, PurePosixPath
          sha = '22eac4c3cc00230ebf452331abcd5a11ce9fa05d'
          data = json.loads(subprocess.check_output(['gh','api',f'repos/1bobby-git/HA-Lotto-645/git/blobs/{sha}']))
          assert data['encoding'] == 'base64'
          packed = base64.b64decode(data['content'])
          assert hashlib.sha256(packed).hexdigest() == 'fb269754bb2c0f617de9bf41da75fb81a14ed63890ca1b1b2aca2f617919df2c'
          prepared = {}
          for update in json.loads(lzma.decompress(packed))['updates']:
              path = update['path']
              parts = PurePosixPath(path).parts
              assert parts and not PurePosixPath(path).is_absolute() and not {'.git','.github','..'} & set(parts)
              target = Path(path)
              assert not target.is_symlink() and path not in prepared
              before = target.read_text() if target.exists() else None
              assert (hashlib.sha256(before.encode()).hexdigest() if before is not None else None) == update['before'], f'Baseline mismatch: {path}'
              if 'copy' in update:
                  after = prepared[update['copy']]
              elif 'content' in update:
                  after = update['content']
              else:
                  lines = before.splitlines(keepends=True)
                  for start, end, replacement in reversed(update['edits']):
                      lines[start:end] = [replacement]
                  after = ''.join(lines)
              assert hashlib.sha256(after.encode()).hexdigest() == update['after'], f'Result mismatch: {path}'
              prepared[path] = after
          for path, content in prepared.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
          print(f'Applied {len(prepared)} hash-verified files')
          PY
      - name: Install and run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest 'lunar_python==1.4.8' 'korean-lunar-calendar==0.4.0'
          python -m compileall -q custom_components/lotto_645 scripts
          git diff --check
          python -m pytest -q 2>&1 | tee /tmp/consensus-tests.log
      - name: Save passing changes to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components docs scripts tests README.md CHANGELOG.md
          git commit -m 'fix: derive reactive consensus from selected sensor numbers v1.12.1'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/reactive-consensus-1.12.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consensus-regression-log
          path: /tmp/consensus-tests.log
          retention-days: 2
