name: Saju and Formula Audit

on:
  push:
    branches: [v1.6.0-saju-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export tracked source only
        run: |
          mkdir -p audit-bundle/wheels
          git archive --format=zip HEAD > audit-bundle/source.zip
          python -m pip download --dest audit-bundle/wheels lunar_python==1.4.8 korean-lunar-calendar==0.4.0 voluptuous voluptuous-serialize
      - uses: actions/upload-artifact@v4
        with:
          name: lotto-audit-source
          path: audit-bundle/
          retention-days: 3
