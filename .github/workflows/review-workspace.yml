name: Review Workspace
on:
  push:
    branches: [feat/v1.10.0-fast-results-qr]
    paths: [.github/workflows/review-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export tracked source and pure Python dependencies
        run: |
          mkdir -p /tmp/review-workspace/wheels
          git archive --format=zip HEAD > /tmp/review-workspace/source.zip
          python -m pip wheel --no-deps --wheel-dir /tmp/review-workspace/wheels lunar_python==1.4.8 korean-lunar-calendar==0.4.0 voluptuous
      - uses: actions/upload-artifact@v4
        with:
          name: review-workspace
          path: /tmp/review-workspace/
          retention-days: 1
