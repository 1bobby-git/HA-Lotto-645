name: Apply Manual Draw Refresh Behavior

on:
  push:
    branches:
      - fix/v1.8.1-manual-draw-evaluation
    paths:
      - .github/workflows/apply-manual-draw-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.8.1-manual-draw-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply manual-refresh patch
        run: python scripts/apply_manual_draw_refresh_patch.py
      - name: Install test dependencies
        run: python -m pip install -q pytest 'lunar_python==1.4.8' 'korean-lunar-calendar==0.4.0'
      - name: Compile and test
        run: |
          python -m compileall -q custom_components/lotto_645 scripts
          python -m pytest -q
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/lotto_645 tests CHANGELOG.md README.md
          git commit -m 'fix: evaluate draw results only after manual refresh'
          git push origin HEAD:fix/v1.8.1-manual-draw-evaluation
