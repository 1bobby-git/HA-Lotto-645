name: Formula audit workspace
on:
  push:
    branches: [feat/research-formulas-1.12.0]
    paths: [.github/workflows/formula-audit-workspace.yml]
permissions:
  contents: write
jobs:
  integrate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Preserve reviewed concurrent main change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess, re
          from pathlib import Path
          main = 'e249c0d3cd0c404847c3180d13380887574dff06'
          base = '4baf71a766d1f25598da8700b037e66514c45dbb'
          paths = ['custom_components/lotto_645/const.py', 'custom_components/lotto_645/manifest.json', 'custom_components/lotto_645/panel_metadata.py', 'custom_components/lotto_645/www/lotto-panel-shell.js', 'docs/PANEL_TOOLS.md', 'scripts/smoke_panel_design_system.py', 'scripts/smoke_panel_tools.py', 'tests/test_draw_ball_styles.py', 'tests/test_panel_metadata.py']
          actual = subprocess.check_output(['git','diff','--name-only',base,main],text=True).splitlines()
          assert set(actual) == set(paths), 'Unreviewed changes in concurrent commit'
          subprocess.run(['git','merge','--no-commit','--no-ff',main],check=False)
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(conflicts).issubset(paths), f'Unexpected merge conflict: {conflicts}'
          for path in paths:
              value = subprocess.check_output(['git','show',f'{main}:{path}']).decode()
              for old,new in [('번호 추천 방식','추첨 공식'),('추천 방식','추첨 공식'),('방식','공식')]:
                  value = value.replace(old,new)
              if path.startswith('custom_components/'):
                  value = value.replace('1.11.10','1.12.0').replace('1.11.11','1.12.0')
              if path.endswith('panel_metadata.py') and path.startswith('custom_components/'):
                  old = 'Home Assistant에 설정된 AI가 추천한 번호를 형식·제외 규칙으로 검증합니다.'
                  assert old in value
                  value = value.replace(old,'번호는 백엔드 CCSS 공식으로 추첨하고 Home Assistant AI는 실행 근거만 설명합니다. AI가 번호를 만들거나 당첨을 예측하지 않습니다.')
              if path.startswith('tests/'):
                  value = value.replace('len(methods.METHODS) == 17','len(methods.METHODS) == 23').replace('len(catalog) == 18','len(catalog) == 24').replace("len({m['method_id'] for m in catalog}) == 18","len({m['method_id'] for m in catalog}) == 24")
              if path == 'tests/test_draw_ball_styles.py':
                  assert 'lotto-panel.js?v=1.11.5' in value
                  value = value.replace('assert "import ', 'assert f"import ').replace('lotto-panel.js?v=1.11.5', 'lotto-panel.js?v={version}')
              if path == 'scripts/smoke_panel_tools.py':
                  value = value.replace('count() == 18','count() == 24').replace('18 guides','24 guides')
              if path.endswith('.md'):
                  value = value.replace('17개','23개').replace('17종','23종').replace('18개 설명','24개 설명')
              Path(path).write_text(value)
          www = Path('custom_components/lotto_645/www')
          for name in ('lotto-panel-shell.js','lotto-panel.js','lotto-panel-design.js','lotto-panel-tools.js'):
              path = www / name
              value = path.read_text()
              path.write_text(re.sub(r'(\.js\?v=)\d+\.\d+\.\d+',r'\g<1>1.12.0',value))
          subprocess.run(['git','add','custom_components','docs','scripts','tests'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Validate merged UI metadata
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_sampling.py tests/test_method_docs.py tests/test_panel_metadata.py tests/test_draw_ball_styles.py
          python -m compileall -q custom_components/lotto_645 scripts
      - name: Save integrated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git commit -m 'merge: preserve v1.11.11 palette and countdown with 23 formulas'
          gh auth setup-git
          git push origin HEAD:refs/heads/feat/research-formulas-1.12.0
      - name: Export integrated source
        if: always()
        run: |
          git archive --format=tar "$(git write-tree)" > /tmp/lotto-formula-integrated.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-integrated-source
          path: /tmp/lotto-formula-integrated.tar
          retention-days: 2
