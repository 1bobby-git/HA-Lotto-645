name: Apply Verified Fast Result and QR Patch
on:
  push:
    branches: [feat/v1.10.0-fast-results-qr]
    paths: [.github/workflows/apply-v110.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify and apply audited source patch
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          encoded=''.join(Path(f'.v110-transfer/part{i:02d}').read_text() for i in range(3))
          assert len(encoded)==36824
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==97551
          assert hashlib.sha256(patch).hexdigest()=='e5f8ea659e401996dbd83f2b7252e1eed0a1656fb612ffb95db92ad6871f272e'
          Path('/tmp/v110.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/v110.patch'],check=True)
          subprocess.run(['git','apply','/tmp/v110.patch'],check=True)
          PY
      - name: Install pinned local QR decoder without a runtime CDN
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,tarfile,urllib.request
          from pathlib import Path
          pin=json.loads(Path('custom_components/lotto_645/www/qr-decoder-pin.json').read_text())
          with urllib.request.urlopen('https://registry.npmjs.org/jsqr/1.4.0',timeout=15) as response:
              metadata=json.load(response)
          expected='sha512-dxLob7q65Xg2DvstYkRpkYtmKm2sPJ9oFhrhmudT1dZvNFFTlroai3AWSpLey/w5vMcLBXRgOJsbXpdN9HzU/A=='
          assert metadata['version']=='1.4.0' and metadata['dist']['integrity']==expected
          with urllib.request.urlopen(metadata['dist']['tarball'],timeout=15) as response:
              data=response.read(2000001)
          assert len(data)<=2000000
          assert 'sha512-'+base64.b64encode(hashlib.sha512(data).digest()).decode()==expected
          root=Path('custom_components/lotto_645/www')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tar:
              for member,target in [('package/dist/jsQR.js','jsQR.js'),('package/LICENSE','LICENSE-jsQR')]:
                  content=tar.extractfile(member).read()
                  root.joinpath(target).write_bytes(content)
          assert hashlib.sha256(root.joinpath('jsQR.js').read_bytes()).hexdigest()=='bc40c8a15196236b2314db0856f72ca0b49980cd5413b8c852a7349f5fee0859'
          PY
      - name: Check syntax and focused regression tests
        run: |
          python -m pip install -q pytest lunar_python==1.4.8 korean-lunar-calendar==0.4.0 voluptuous aiohttp
          python -m compileall -q custom_components/lotto_645 scripts
          node --check custom_components/lotto_645/www/lotto-panel.js
          python -m pytest -q tests/test_fast_results.py tests/test_ticket_qr.py
      - name: Remove transfer scaffolding and commit to the feature branch
        run: |
          rm -rf .v110-transfer
          rm .github/workflows/apply-v110.yml .github/workflows/fast-result-workspace.yml .github/workflows/fast-source-probe.yml .github/workflows/verify-brand-sources.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: fast published result checks and local QR ticket panel (v1.10.0)'
          git push origin HEAD:feat/v1.10.0-fast-results-qr
