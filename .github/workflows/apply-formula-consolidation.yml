name: Apply formula consolidation
on:
  push:
    branches: [feat/consolidate-formulas-1.14.0]
    paths: [.github/workflows/apply-formula-consolidation.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == '1bobby-git/HA-Lotto-645' && github.ref == 'refs/heads/feat/consolidate-formulas-1.14.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consolidate-formulas-1.14.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply immutable reviewed script with explicit shell reconciliation
        run: |
          python - <<'PY'
          import subprocess, textwrap
          # Reuse the reviewed script at an immutable commit, not arbitrary remote code.
          body = subprocess.check_output(['git','show','5dd6fead9063306e976c804878dbc777ff4fee90:.github/workflows/apply-formula-consolidation.yml'],text=True)
          source = textwrap.dedent(body.split("          python - <<'PY'\n",1)[1].split('          PY\n',1)[0])
          before = "assert conflicts <= {'CHANGELOG.md','custom_components/lotto_645/ticket_panel.py'},"
          assert source.count(before) == 1
          source = source.replace(before, "assert conflicts <= {'CHANGELOG.md','custom_components/lotto_645/ticket_panel.py','custom_components/lotto_645/www/lotto-panel-shell.js'},")
          needle = "if 'custom_components/lotto_645/ticket_panel.py' in conflicts:"
          assert source.count(needle) == 1
          source = source.replace(needle, "if 'custom_components/lotto_645/www/lotto-panel-shell.js' in conflicts:\n    Path('custom_components/lotto_645/www/lotto-panel-shell.js').write_text(git('show','origin/main:custom_components/lotto_645/www/lotto-panel-shell.js').stdout)\n" + needle)
          exec(compile(source,'reviewed-consolidation-patch','exec'))
          PY
      - name: Run all Python regression tests before publishing the feature branch
        run: |
          set -euo pipefail
          python -m pip install -q pytest 'lunar_python==1.4.8' 'korean-lunar-calendar==0.4.0'
          python -m compileall -q custom_components/lotto_645 scripts tests
          python -m pytest -q | tee /tmp/consolidation-tests.txt
          git diff --check
      - name: Publish tested source to feature branch only
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'feat: retire redundant formulas, expose family presets and migrate safely v1.15.0'
          git push origin HEAD:refs/heads/feat/consolidate-formulas-1.14.0
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-test-log
          path: /tmp/consolidation-tests.txt
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-source
          include-hidden-files: true
          retention-days: 3
          path: |
            .
            !.git
            !**/__pycache__/**
            !.pytest_cache/**
