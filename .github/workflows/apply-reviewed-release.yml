name: Apply Reviewed Release
on:
  push:
    branches: [feat/v1.10.0-fast-results-qr]
    paths: [.github/workflows/apply-reviewed-release.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.10.0-fast-results-qr
      - name: Verify and apply exact reviewed patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          parts=[Path('.review-patch/part0'),Path('.review-patch/part1')]
          expected=['ea5dff8b449e4f2c74edb9ed75dcfcb2175d9c3d','9cae81aa9a6ff1613f5ac778ed47aadc1613eb9e']
          for p, sha in zip(parts,expected):
              b=p.read_bytes()
              assert hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()==sha, p
          patch=lzma.decompress(base64.b64decode(b''.join(p.read_bytes() for p in parts),validate=True),memlimit=67108864)
          assert len(patch)==86471
          assert hashlib.sha256(patch).hexdigest()=='a476d396e431942d5385f0f21d172cc55e735f5b590539dc103982a0fe2d2144'
          Path('/tmp/reviewed.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/reviewed.patch'],check=True)
          subprocess.run(['git','apply','/tmp/reviewed.patch'],check=True)
          for p in parts:p.unlink()
          Path('.review-patch').rmdir()
          Path('.github/workflows/apply-reviewed-release.yml').unlink()
          PY
          python -m compileall -q custom_components/lotto_645 scripts
          git diff --check
      - name: Commit only to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: local method reviews, grouped result entities and winning-detail binary sensor'
          git push origin HEAD:feat/v1.10.0-fast-results-qr
