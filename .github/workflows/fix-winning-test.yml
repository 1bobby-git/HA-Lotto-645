name: Fix winning highlight fixture
on:
  push:
    branches:
      - fix/winning-number-visuals-1.12.2
    paths:
      - .github/workflows/fix-winning-test.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Close modal before review interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke_ticket_panel.py')
          s=p.read_text()
          old="""        await page.locator('#tab-review').click()\n"""
          new="""        await page.locator('#close-editor').click()\n        await page.locator('#tab-review').click()\n"""
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old2="""        assert '보너스 9' in await second.locator('.result-detail').text_content()\n        await page.locator('#close-editor').click()\n"""
          new2="""        assert '보너스 9' in await second.locator('.result-detail').text_content()\n"""
          assert s.count(old2)==1
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Commit fixture fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke_ticket_panel.py
          git commit -m 'test: close editor before winning-result review assertions'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/winning-number-visuals-1.12.2
