name: Apply Korean birthplace and sensor pruning update

on:
  push:
    branches: [feat/korean-birthplace-prune-sensors-v1.19.0]
    paths: [.github/workflows/apply-korean-birthplace-prune.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/korean-birthplace-prune-sensors-v1.19.0
      - name: Apply v1.19.0 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path);text=p.read_text();count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected 1 match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          # Version and frontend cache keys.
          replace_once('custom_components/lotto_645/const.py','VERSION = "1.18.1"','VERSION = "1.19.0"')
          replace_once('custom_components/lotto_645/manifest.json','"version": "1.18.1"','"version": "1.19.0"')
          for path in ('custom_components/lotto_645/www/lotto-panel-shell.js','custom_components/lotto_645/www/lotto-panel-validation.js'):
              p=Path(path);text=p.read_text()
              if '1.18.1' not in text: raise SystemExit(f'{path}: expected v1.18.1 marker')
              p.write_text(text.replace('1.18.1','1.19.0'))

          # Korea-only, dependency-free birthplace catalog. Existing non-Korean
          # values remain selectable only for backward compatibility.
          Path('custom_components/lotto_645/korean_birthplaces.py').write_text('''"""Built-in South Korean birthplace choices for the Saju options flow.

The birth-place label is metadata for the local Four Pillars calculation. Korea
uses one civil timezone, so new Korean choices are paired with Asia/Seoul in the
options flow. No geocoding or network download is required.
"""
from __future__ import annotations

KOREAN_BIRTHPLACES: tuple[str, ...] = (
    "서울특별시",
    "부산광역시",
    "대구광역시",
    "인천광역시",
    "광주광역시",
    "대전광역시",
    "울산광역시",
    "세종특별자치시",
    "경기도",
    "강원특별자치도",
    "충청북도",
    "충청남도",
    "전북특별자치도",
    "전라남도",
    "경상북도",
    "경상남도",
    "제주특별자치도",
)
KOREAN_BIRTHPLACE_VALUES = frozenset(KOREAN_BIRTHPLACES)


def birthplace_selector_options(current: object = None) -> list[dict[str, str]]:
    """Return the fixed Korean choices plus one saved legacy value if needed."""
    value = str(current or "").strip()
    result = [{"value": item, "label": item} for item in KOREAN_BIRTHPLACES]
    if value and value not in KOREAN_BIRTHPLACE_VALUES:
        result.insert(0, {"value": value, "label": f"기존 입력 · {value}"})
    return result


def is_supported_birthplace(value: object, *, legacy: object = None) -> bool:
    """Accept Korea choices and only the exact value already saved by older versions."""
    text = str(value or "").strip()
    previous = str(legacy or "").strip()
    return bool(text) and (text in KOREAN_BIRTHPLACE_VALUES or (previous and text == previous))
''')

          # Config flow: dropdown instead of free-form birthplace, and Korea
          # automatically uses Asia/Seoul so users no longer type an IANA zone.
          path='custom_components/lotto_645/config_flow.py';p=Path(path);text=p.read_text()
          marker='from .methods import (\n'
          insertion='from .korean_birthplaces import (\n    KOREAN_BIRTHPLACE_VALUES,\n    birthplace_selector_options,\n    is_supported_birthplace,\n)\n'
          if insertion not in text:
              if text.count(marker)!=1: raise SystemExit('config_flow import marker mismatch')
              text=text.replace(marker,insertion+marker,1)
          old='''    timezone = str(\n        options.get(CONF_SAJU_TIMEZONE, DEFAULT_SAJU_TIMEZONE)\n        or DEFAULT_SAJU_TIMEZONE\n    )\n    longitude_marker = _optional_text_marker(CONF_SAJU_LONGITUDE, options)\n'''
          new='''    birth_place = str(options.get(CONF_SAJU_BIRTH_PLACE, "") or "").strip()\n    birthplace_marker = (\n        vol.Required(CONF_SAJU_BIRTH_PLACE, default=birth_place)\n        if birth_place\n        else vol.Required(CONF_SAJU_BIRTH_PLACE)\n    )\n    longitude_marker = _optional_text_marker(CONF_SAJU_LONGITUDE, options)\n'''
          if text.count(old)!=1: raise SystemExit('config_flow timezone schema marker mismatch')
