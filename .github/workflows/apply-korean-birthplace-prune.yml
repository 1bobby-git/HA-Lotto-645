name: Apply Korean birthplace and sensor pruning update

on:
  push:
    branches:
      - feat/korean-birthplace-prune-sensors-v1.19.0
    paths:
      - .github/workflows/apply-korean-birthplace-prune.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/korean-birthplace-prune-sensors-v1.19.0
      - name: Apply source patch
        run: python scripts/apply_v1_19_patch.py
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: Korean birthplace selector and prune deselected sensors v1.19.0'
          git push origin HEAD:feat/korean-birthplace-prune-sensors-v1.19.0
