sert '_prune_stale_optional_sensor_entities' in __import__('inspect').getsource(sensor_module.async_setup_entry)\n        from homeassistant.helpers.storage import Store\n"""
          if text.count(old)!=1: raise SystemExit('smoke sensor module marker mismatch')
