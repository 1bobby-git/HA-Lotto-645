                  saju['data_description'].pop('saju_timezone',None)
                  data['options']['step']['recommendations']['data_description']['selected_methods'] += ' Sensors for formulas removed from the selection are deleted from the entity registry after reload.'
                  data['options']['error']['select_korean_birthplace']='Choose one of the 17 South Korean regions.'
              p.write_text(__import__('json').dumps(data,ensure_ascii=False,indent=2)+'\n')

          # Pure data tests do not need Home Assistant installed.
          Path('tests/test_korean_birthplaces.py').write_text('''from importlib.util import module_from_spec, spec_from_file_location\nfrom pathlib import Path\n\nROOT=Path(__file__).resolve().parents[1]\nSPEC=spec_from_file_location("lotto_korean_birthplaces",ROOT/"custom_components/lotto_645/korean_birthplaces.py")\nMODULE=module_from_spec(SPEC);SPEC.loader.exec_module(MODULE)\n\ndef test_korean_birthplace_catalog_is_small_fixed_and_unique():\n    values=MODULE.KOREAN_BIRTHPLACES\n    assert len(values)==17 and len(set(values))==17\n    assert values[0]=="서울특별시"\n    assert "세종특별자치시" in values and "제주특별자치도" in values\n    assert MODULE.is_supported_birthplace("경기도")\n    assert not MODULE.is_supported_birthplace("free form")\n\ndef test_legacy_value_is_preserved_but_not_open_ended():\n    options=MODULE.birthplace_selector_options("Tokyo, Japan")\n    assert options[0]=={"value":"Tokyo, Japan","label":"기존 입력 · Tokyo, Japan"}\n    assert len(options)==18\n    assert MODULE.is_supported_birthplace("Tokyo, Japan",legacy="Tokyo, Japan")\n    assert not MODULE.is_supported_birthplace("Osaka, Japan",legacy="Tokyo, Japan")\n''')

          # Extend the real HA selector/options smoke and registry-pruning contract.
          path='scripts/smoke_ha_options.py';p=Path(path);text=p.read_text()
          old='''        serialize_form(await flow.async_step_recommendations())\n        serialize_form(await flow.async_step_saju())\n'''
          new='''        serialize_form(await flow.async_step_recommendations())\n        saju_form=await flow.async_step_saju()\n        serialize_form(saju_form)\n        saju_fields=to_field_list(saju_form['data_schema'],custom_serializer=cv.custom_serializer)\n        saju_names={field['name'] for field in saju_fields}\n        assert const.CONF_SAJU_BIRTH_PLACE in saju_names\n        assert const.CONF_SAJU_TIMEZONE not in saju_names\n        birthplace_field=next(field for field in saju_fields if field['name']==const.CONF_SAJU_BIRTH_PLACE)\n        birthplace_options=birthplace_field['selector']['select']['options']\n        assert len(birthplace_options)==17\n        assert any(option['value']=='서울특별시' for option in birthplace_options)\n'''
