name: Apply Purchased Tickets
on:
  push:
    branches: [feat/v1.9.0-purchased-ticket-results]
    paths: [.github/workflows/apply-purchased-tickets.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify and apply the reviewed change set
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma
          import subprocess
          chunks = [Path(f'.maintenance/tickets-{i}.b64') for i in range(3)]
          encoded = ''.join(p.read_text().strip() for p in chunks)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '722ac4f0a50379c0e61a2002b5890e70553abc9c6258c993d3c88f663e7a2b60', 'Transfer checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for path in chunks:
              path.unlink()
          Path('.github/workflows/apply-purchased-tickets.yml').unlink()
          PY
          python -m compileall -q custom_components/lotto_645 scripts
          git diff --check
      - name: Commit the feature on its isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: round-named draw sensor and five purchased ticket results (v1.9.0)'
          git push origin HEAD:feat/v1.9.0-purchased-ticket-results
