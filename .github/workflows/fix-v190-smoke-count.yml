name: Fix v1.9 Summary Smoke
on:
  push:
    branches: [feat/v1.9.0-purchased-ticket-results]
    paths: [.github/workflows/fix-v190-smoke-count.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align summary expectation with two local games plus AI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke_ha_options.py')
          s=p.read_text()
          old="assert summary_sensor.native_value=='31회 추천 · 1게임'"
          new="assert summary_sensor.native_value=='31회 추천 · 3게임'"
          if old not in s:
              raise SystemExit('summary smoke anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          python -m compileall -q scripts
          git diff --check
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/fix-v190-smoke-count.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align recommendation summary game count'
          git push
