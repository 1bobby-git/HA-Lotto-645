name: Apply tested Core refactor
on:
  push:
    branches: ['feat/core-separation-1.21.0']
    paths: ['.github/workflows/apply-core-refactor.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == '1bobby-git/HA-Lotto-645'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply source-only patch and verify the locally tested Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF'] == 'refs/heads/feat/core-separation-1.21.0'
          blobs = ['ca0f71ccb9d84c77707710b45d21c611d975b0e1', '111902528d68ca53d1e80683877dc4d3e372e566', '961a33e6933fbe3dd35098b16139b159406cd426', '0db4cae51ba4be8564a35b7c4fe0a0012e20c580']
          parts = []
          for sha in blobs:
              data = json.loads(subprocess.check_output(['gh', 'api', f'repos/1bobby-git/HA-Lotto-645/git/blobs/{sha}']))
              part = base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(part)}\0'.encode() + part).hexdigest() == sha
              parts.append(part)
          packed = base64.b64decode(b''.join(parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '9727ca46bd49fd6955db3d7826f8ccc0a7998888dc22379b482712293326892b'
          patch = json.loads(lzma.decompress(packed))
          assert patch['base_commit'] == 'ec75888e09c0e7a16513292474a9e97dbfce718d'
          def path(name):
              p = Path(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert not any(parent.is_symlink() for parent in [p, *p.parents])
              return p
          copies = {name: path(origin).read_bytes() for name, origin in patch['copies'].items()}
          for name, data in copies.items():
              p = path(name); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(data)
          for name, change in patch['edits'].items():
              p = path(name); data = p.read_bytes()
              assert hashlib.sha256(data).hexdigest() == change['base_sha256'], name
              lines = data.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(change['operations']):
                  lines[start:end] = [replacement]
              p.write_bytes(''.join(lines).encode())
          for name, text in patch['new'].items():
              p = path(name); assert not p.exists(), name
              p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(text.encode())
          for name in patch['delete']:
              path(name).unlink(missing_ok=True)
          for name, expected in patch['hashes'].items():
              assert hashlib.sha256(path(name).read_bytes()).hexdigest() == expected, name
          Path('.github/workflows/apply-core-refactor.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '79c84d0ab01f46da245944c78d786a5a87f15dc6', tree
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Exact locally tested source tree:', tree)
          PY
      - name: Commit to the feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name '1bobby-git'
          git config user.email '66291955+1bobby-git@users.noreply.github.com'
          git commit -m 'refactor: standalone Lotto Core, remove replay tools and repair live panel v1.21.0'
          gh auth setup-git
          git push origin HEAD:refs/heads/feat/core-separation-1.21.0
