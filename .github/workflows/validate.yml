name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pytest 'lunar_python==1.4.8' 'korean-lunar-calendar==0.4.0'
      - name: Compile Python sources
        run: python -m compileall -q custom_components/lotto_645 scripts
      - name: Run all regression and rule-table tests
        run: python -m pytest -q
  ha-options:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared Home Assistant baseline
        run: python -m pip install 'homeassistant==2026.9.0' 'lunar_python==1.4.8' 'korean-lunar-calendar==0.4.0'
      - name: Exercise real HA OptionsFlow and selector serialization
        run: python scripts/smoke_ha_options.py
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
