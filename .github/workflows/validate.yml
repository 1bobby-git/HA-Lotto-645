name: Validate public component
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest aiohttp voluptuous
      - run: python -m compileall -q custom_components/lotto_645
      - run: python -m pytest -q tests/test_lab_service_client.py tests/test_remote_cutover.py
