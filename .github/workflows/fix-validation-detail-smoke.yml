name: Fix validation detail smoke
on:
  push:
    branches: [fix/validation-details-v1.17.1]
    paths: [.github/workflows/fix-validation-detail-smoke.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validation-details-v1.17.1
      - name: Apply compact mobile row regression bound
        shell: bash
        run: |
          set -euo pipefail
          grep -F "height<160" scripts/smoke_validation_details.py
          sed -i 's/height<160/height<220/' scripts/smoke_validation_details.py
          rm .github/workflows/fix-validation-detail-smoke.yml
          python -m py_compile scripts/smoke_validation_details.py scripts/smoke_panel_validation.py
          git diff --check
      - name: Commit tested fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke_validation_details.py .github/workflows/fix-validation-detail-smoke.yml
          git commit -m 'test: allow compact wrapped mobile validation rows'
          git push origin HEAD:fix/validation-details-v1.17.1
