name: Fast Result Workspace
on:
  push:
    branches: [feat/v1.10.0-fast-results-qr]
    paths: [.github/workflows/fast-result-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export tracked source and dependencies
        run: |
          mkdir -p /tmp/lotto-workspace/wheels /tmp/lotto-workspace/fixtures
          git archive --format=zip HEAD > /tmp/lotto-workspace/source.zip
          python -m pip wheel --no-deps --wheel-dir /tmp/lotto-workspace/wheels lunar_python==1.4.8 korean-lunar-calendar==0.4.0 voluptuous
      - name: Fetch bounded public fixtures respecting robots
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.robotparser
          from pathlib import Path
          targets = {
            'daum': 'https://search.daum.net/search?w=tot&q=%EB%A1%9C%EB%98%90',
            'mbc': 'https://imnews.imbc.com/rss/news/news_00.xml',
            'sbs': 'https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=01&plink=RSSREADER',
            'yna': 'https://www.yna.co.kr/rss/society.xml',
          }
          root=Path('/tmp/lotto-workspace/fixtures')
          records=[]
          ua='HA-Lotto-645/1.10 (+https://github.com/1bobby-git/HA-Lotto-645)'
          for key,url in targets.items():
            entry={'provider':key,'url':url}
            try:
              parsed=urllib.parse.urlsplit(url)
              robot_url=urllib.parse.urlunsplit((parsed.scheme,parsed.netloc,'/robots.txt','',''))
              req=urllib.request.Request(robot_url,headers={'User-Agent':ua})
              try:
                with urllib.request.urlopen(req,timeout=12) as response:
                  robots=response.read(256000).decode('utf-8','replace')
                rp=urllib.robotparser.RobotFileParser();rp.parse(robots.splitlines())
                root.joinpath(key+'.robots.txt').write_text(robots)
                if not rp.can_fetch(ua,url):
                  entry['status']='robots_disallowed';records.append(entry);continue
              except urllib.error.HTTPError as err:
                if err.code != 404: raise
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=12) as response:
                entry['status']=response.status
                entry['content_type']=response.headers.get('Content-Type')
                data=response.read(2000001)
                if len(data)>2000000: raise ValueError('response too large')
                root.joinpath(key+'.source').write_bytes(data)
            except Exception as err:
              entry['error']=str(err)
            records.append(entry)
          root.joinpath('fetch-report.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          print(json.dumps(records,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fast-result-workspace
          path: /tmp/lotto-workspace/
          retention-days: 1
