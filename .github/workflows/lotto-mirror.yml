name: Update Lotto Mirror

on:
  push:
    branches:
      - main
    paths:
      - scripts/update_lotto_mirror.py
      - .github/workflows/lotto-mirror.yml
  schedule:
    # Centralized, low-frequency checks after the Saturday ~20:35 KST draw.
    # Each run is strictly sequential and limited to <=4 official requests;
    # Home Assistant clients continue to read the shared mirror instead of
    # individually crawling Donghaeng Lottery.
    - cron: "45 11 * * 6"  # Saturday 20:45 KST
    - cron: "10 12 * * 6"  # Saturday 21:10 KST
    - cron: "40 12 * * 6"  # Saturday 21:40 KST
    - cron: "20 13 * * 6"  # Saturday 22:20 KST
    - cron: "50 13 * * 6"  # Saturday 22:50 KST late-publication fallback
    - cron: "30 0 * * 0"   # Sunday 09:30 KST final fallback
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-history-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update shared history mirror
        run: python scripts/update_lotto_mirror.py

      - name: Validate mirror JSON and bundled seed
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = [
              Path('data/lotto645-history.json'),
              Path('custom_components/lotto_645/history_seed.json'),
          ]
          for path in paths:
              assert path.exists(), f'missing {path}'
              d = json.loads(path.read_text(encoding='utf-8'))
              rows = d['draws']
              assert rows
              assert d['latest_round'] == len(rows)
              assert d['draw_count'] == len(rows)
              assert [int(x['round']) for x in rows] == list(range(1, len(rows) + 1))
              for row in rows:
                  nums = [int(x) for x in row['numbers']]
                  assert len(nums) == 6 and len(set(nums)) == 6
                  assert all(1 <= x <= 45 for x in nums)
                  bonus = int(row['bonus'])
                  assert 1 <= bonus <= 45 and bonus not in nums
              canonical = json.dumps(
                  rows,
                  ensure_ascii=False,
                  separators=(',', ':'),
                  sort_keys=True,
              ).encode('utf-8')
              assert hashlib.sha256(canonical).hexdigest() == d['draws_sha256']
              print(f"validated {path}: round {d['latest_round']}")
          assert paths[0].read_bytes() == paths[1].read_bytes()
          PY

      - name: Commit mirror only when changed
        run: |
          CHANGES="$(git status --porcelain -- data/lotto645-history.json custom_components/lotto_645/history_seed.json)"
          if [ -z "$CHANGES" ]; then
            echo "Mirror unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto645-history.json custom_components/lotto_645/history_seed.json
          git commit -m "data: update lotto history mirror [skip release]"
          git push
