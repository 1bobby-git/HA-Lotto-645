name: Verify Original Brand Sources
on:
  push:
    branches: [feat/v1.10.0-fast-results-qr]
    paths: [.github/workflows/verify-brand-sources.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect original-size image objects without altering repository
        run: |
          python - <<'PY'
          import subprocess, struct, json, hashlib
          from pathlib import Path
          out=Path('/tmp/brand-inspect');out.mkdir()
          objects=subprocess.check_output(['git','rev-list','--objects','--all']).decode().splitlines()
          seen=set();records=[];total=0
          for line in objects:
              parts=line.split(' ',1)
              if len(parts)!=2:continue
              sha,name=parts
              if sha in seen or not name.lower().endswith('.png'):continue
              seen.add(sha)
              size=int(subprocess.check_output(['git','cat-file','-s',sha]))
              if not 100000<=size<=2000000:continue
              blob=subprocess.check_output(['git','cat-file','blob',sha])
              if not blob.startswith(b'\x89PNG\r\n\x1a\n'):continue
              w,h=struct.unpack('>II',blob[16:24])
              record={'sha':sha,'name':name,'size':size,'width':w,'height':h,'sha256':hashlib.sha256(blob).hexdigest()}
              records.append(record)
              if w>=1800 and h>=600 and total+size<=20000000:
                  out.joinpath(sha+'.png').write_bytes(blob);total+=size
          out.joinpath('objects.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
          PY
      - name: Probe publisher-declared Newsis RSS respecting robots
        run: |
          python - <<'PY'
          import urllib.request,urllib.robotparser,json
          from pathlib import Path
          root=Path('/tmp/brand-inspect');ua='HA-Lotto-645/1.10 (+https://github.com/1bobby-git/HA-Lotto-645)'
          result={}
          try:
              with urllib.request.urlopen(urllib.request.Request('https://www.newsis.com/robots.txt',headers={'User-Agent':ua}),timeout=10) as r: text=r.read(256000).decode()
              p=urllib.robotparser.RobotFileParser();p.parse(text.splitlines())
              url='https://www.newsis.com/RSS/sokbo.xml';result['allowed']=p.can_fetch(ua,url)
              if result['allowed']:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=10) as r:
                      result['http_status']=r.status;body=r.read(2000000)
                  root.joinpath('newsis-rss.xml').write_bytes(body)
          except Exception as e:result['error']=str(e)
          root.joinpath('newsis-report.json').write_text(json.dumps(result));print(result)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brand-source-inspection
          path: /tmp/brand-inspect/
          retention-days: 1
