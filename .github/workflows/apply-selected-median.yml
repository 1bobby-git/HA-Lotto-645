name: Apply Selected Median Consensus

on:
  push:
    branches:
      - feat/v1.7.0-selected-median-consensus
    paths:
      - .github/workflows/apply-selected-median.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.7.0-selected-median-consensus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch script
        run: python scripts/apply_selected_median_patch.py
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest "lunar_python==1.4.8" "korean-lunar-calendar==0.4.0"
      - name: Compile and test
        run: |
          python -m compileall -q custom_components/lotto_645 tests scripts
          python -m pytest -q
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components tests README.md CHANGELOG.md docs/FORMULAS.md
          git diff --cached --check
          git commit -m "feat: add selected-method median consensus recommendation"
          git push origin HEAD:feat/v1.7.0-selected-median-consensus
