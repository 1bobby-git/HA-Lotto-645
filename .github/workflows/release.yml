name: Release
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: lotto-validated-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish only the tested commit for HACS
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import json; print(json.load(open('custom_components/lotto_645/manifest.json'))['version'])")
          TAG="v${VERSION}"
          HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$HEAD" != "$TESTED_SHA" ]; then
            echo "Main advanced; wait for the newest commit to pass validation."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; never retarget a published version."
            exit 0
          fi
          gh release create "$TAG" --target "$TESTED_SHA" --title "$TAG" --generate-notes
