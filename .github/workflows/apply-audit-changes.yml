name: Apply Audited Changes
on:
  push:
    branches: ["feat/v1.6.0-saju-formula-audit"]
    paths: [".github/workflows/apply-audit-changes.yml"]
permissions:
  contents: write
concurrency:
  group: lotto-apply-audited-changes
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.6.0-saju-formula-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify and apply reviewed source patch
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          from pathlib import Path
          parts = [Path(f".audit/patch-{index}.b64") for index in range(1, 6)]
          encoded = "".join("".join(path.read_text().split()) for path in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = "85bc936d061629f885a03db595dadf7cadaae6060ef2cf1e014d354aacaa1212"
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected or len(patch) != 189343:
              raise SystemExit(f"Patch integrity failure: {actual}, {len(patch)} bytes")
          Path("/tmp/lotto-audit.patch").write_bytes(patch)
          print(f"Verified reviewed patch: {actual}, {len(patch)} bytes")
          PY
          git apply --check /tmp/lotto-audit.patch
          git apply --index /tmp/lotto-audit.patch
          git rm .audit/patch-*.b64 .github/workflows/apply-audit-changes.yml
          git diff --cached --check
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check pytest "lunar_python==1.4.8" "korean_lunar_calendar==0.3.1"
      - name: Compile and run all regression tests
        run: |
          python -m compileall -q custom_components/lotto_645 tests scripts
          python -m pytest -q
      - name: Commit only validated implementation and audit documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          git commit -m "feat: source-traceable Saju and audited recommendation formulas for v1.6.0"
          git push origin HEAD:feat/v1.6.0-saju-formula-audit
