name: Audit Workspace
on:
  push:
    branches: ["feat/v1.6.0-saju-formula-audit"]
    paths: [".github/workflows/audit-workspace.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare reproducible audit bundle
        run: |
          python -m pip install --target /tmp/audit-deps "lunar_python==1.4.8" "voluptuous==0.15.2"
          tar --exclude=.git -czf /tmp/lotto-audit-source.tar.gz .
          tar -czf /tmp/lotto-audit-deps.tar.gz -C /tmp/audit-deps .
      - uses: actions/upload-artifact@v4
        with:
          name: lotto-audit-workspace
          path: /tmp/lotto-audit-*.tar.gz
          retention-days: 1
