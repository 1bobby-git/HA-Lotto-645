name: Render Local Brand Assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Validate and render brand assets locally
        run: python scripts/render_brand.py
      - name: Verify generated PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths = [
              Path('images/logo-horizontal.png'),
              Path('images/icon-square.png'),
              Path('custom_components/lotto_645/brand/logo.png'),
              Path('custom_components/lotto_645/brand/icon.png'),
          ]
          for path in paths:
              with Image.open(path) as image:
                  image.verify()
              print(f'valid PNG: {path}')
          PY
