name: Research source snapshot
on:
  push:
    branches: [feature/researched-formulas]
    paths: [.github/workflows/research-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated Python test dependencies
        run: python -m pip wheel --no-deps --wheel-dir /tmp/test-wheels lunar_python==1.4.8 korean-lunar-calendar==0.4.0 voluptuous==0.15.2
      - uses: actions/upload-artifact@v4
        with:
          name: test-wheels
          retention-days: 1
          path: /tmp/test-wheels
