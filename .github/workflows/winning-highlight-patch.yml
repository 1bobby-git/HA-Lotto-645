name: Winning highlight patch
on:
  push:
    branches:
      - fix/winning-number-visuals-1.12.2
    paths:
      - .github/workflows/winning-highlight-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply staged patch
        run: python scripts/apply_winning_highlight_patch.py
      - name: Validate source
        run: |
          python -m pip install -q pytest lunar_python==1.4.8 korean-lunar-calendar==0.4.0
          python -m compileall -q custom_components/lotto_645 scripts
          git diff --check
          python -m pytest -q
      - name: Commit validated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components scripts/smoke_ticket_panel.py tests CHANGELOG.md
          git commit -m 'fix: highlight matched winning numbers in result review v1.12.2'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/winning-number-visuals-1.12.2
