name: Fix v1.9 README
on:
  push:
    branches: [feat/v1.9.0-purchased-ticket-results]
    paths: [.github/workflows/fix-v190-readme.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete manual-only wording from v1.9 section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          old='''**v1.8.1 수동 결과 갱신은 그대로 유지**합니다. 새 추첨 결과를 받으려면 `즉시 새로고침 · 번호 재생성`을 누르세요. 기존추천 스냅샷과 대조하고 구매번호는 바꾸지 않습니다.'''
          new='''새 회차는 공유 미러 발표 직후 자동 확인 일정 또는 일반 갱신에서 반영되며, `즉시 새로고침 · 번호 재생성`으로도 즉시 확인할 수 있습니다. 결과 판정은 발표 전 추천 스냅샷과 같은 회차의 직접 구매번호를 사용합니다.'''
          if old not in s:
              raise SystemExit('obsolete v1.9 README paragraph not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/fix-v190-readme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align v1.9 automatic result refresh behavior'
          git push
