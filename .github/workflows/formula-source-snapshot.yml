name: Formula source snapshot
on:
  push:
    branches: ['feat/recommended-formulas-1.20.0']
    paths: ['.github/workflows/formula-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked public source for local regression tests
        run: git archive --format=tar HEAD > /tmp/lotto-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: lotto-source
          path: /tmp/lotto-source.tar
          retention-days: 1
