name: Formula source snapshot
on:
  push:
    branches: ['feat/recommended-formulas-1.20.0']
    paths: ['.github/workflows/formula-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked public source
        run: git archive --format=tar HEAD > /tmp/lotto-source.tar
      - name: Prepare declared offline test wheels
        run: python -m pip wheel --disable-pip-version-check -q --wheel-dir /tmp/lotto-wheels 'lunar_python==1.4.8' 'korean-lunar-calendar==0.4.0' voluptuous
      - uses: actions/upload-artifact@v4
        with:
          name: lotto-source
          path: |
            /tmp/lotto-source.tar
            /tmp/lotto-wheels
          retention-days: 1
