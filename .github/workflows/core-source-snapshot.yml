name: Core source snapshot
on:
  push:
    branches: ['feat/core-separation-1.21.0']
    paths: ['.github/workflows/core-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > /tmp/lotto-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: core-baseline
          path: /tmp/lotto-source.tar
          retention-days: 1
