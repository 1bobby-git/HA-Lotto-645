name: Apply Draw Evaluation Feature

on:
  push:
    branches:
      - feat/v1.8.0-draw-result-evaluation
    paths:
      - .github/workflows/apply-draw-evaluation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.8.0-draw-result-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply source patch
        run: python scripts/apply_draw_evaluation_patch.py
      - name: Install test dependencies
        run: python -m pip install -q pytest 'lunar_python==1.4.8' 'korean-lunar-calendar==0.4.0'
      - name: Compile and test
        run: |
          python -m compileall -q custom_components/lotto_645 scripts
          python -m pytest -q
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/lotto_645 scripts/smoke_ha_options.py tests CHANGELOG.md README.md
          git commit -m 'feat: add draw numbers and winning status sensors'
          git push origin HEAD:feat/v1.8.0-draw-result-evaluation
