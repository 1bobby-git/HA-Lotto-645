name: Finalize validation source contract
on:
  push:
    branches: [fix/validation-muted-misses-v1.15.1]
    paths: [.github/workflows/fix-validation-source-contract.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align source-contract comment with background worker design
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/lotto_645/ticket_panel.py')
          s=p.read_text()
          old='''async def historical_validate(hass, connection, msg):\n    """Run a read-only simulation in an HA-owned task and retain its latest state."""\n    coordinator = _coordinator(hass, msg)\n'''
          new='''async def historical_validate(hass, connection, msg):\n    """Run a read-only simulation in an HA-owned task and retain its latest state."""\n    # `_validation_worker` owns async_validate_history(...) so page/WebSocket\n    # cancellation cannot abort the Home Assistant-owned calculation.\n    coordinator = _coordinator(hass, msg)\n'''
          if old not in s:
              raise SystemExit('expected handler prelude not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/fix-validation-source-contract.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: document background validation executor contract'
          git push origin HEAD:fix/validation-muted-misses-v1.15.1
