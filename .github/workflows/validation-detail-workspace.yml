name: Validation detail workspace
on:
  push:
    branches: [fix/validation-details-v1.17.1]
    paths: [.github/workflows/validation-detail-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ebcd43b043695124328e66e267f0ede733c8e55
          persist-credentials: false
      - run: git archive HEAD -o /tmp/lotto-details-baseline.tar
      - uses: actions/upload-artifact@v4
        with:
          name: lotto-details-baseline
          path: /tmp/lotto-details-baseline.tar
          retention-days: 1
