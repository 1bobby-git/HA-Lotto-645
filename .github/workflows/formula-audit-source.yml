name: Formula audit source
on:
  push:
    branches: [feat/research-ac-formula]
    paths: [.github/workflows/formula-audit-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: formula-audit-source
          retention-days: 1
          include-hidden-files: true
          path: |
            .
            !.git
