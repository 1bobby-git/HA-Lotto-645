name: Apply Original Lotto Logo

on:
  push:
    branches:
      - v1.5.1-fix
    paths:
      - brand_source_chunks/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5.1-fix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"

      - name: Reconstruct exact user-provided horizontal PNG
        shell: bash
        run: |
          cat brand_source_chunks/logo.b64.* | tr -d '\n\r' | base64 --decode > images/logo-horizontal.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          path = Path('images/logo-horizontal.png')
          data = path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '2e9f3b38418f82f0f949a2d2e12e47e084d81ca863dbfb6b208e9518a1ec8573'
          im = Image.open(path)
          assert im.size == (2172, 724), im.size
          assert im.mode == 'RGBA', im.mode
          print('restored exact canonical logo:', im.size, im.mode)
          PY

      - name: Crop square icon from exact horizontal logo
        run: python scripts/render_brand.py

      - name: Commit exact logo and cropped icon assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/logo-horizontal.png images/icon-square.png \
            custom_components/lotto_645/brand/logo.png \
            custom_components/lotto_645/brand/logo@2x.png \
            custom_components/lotto_645/brand/icon.png \
            custom_components/lotto_645/brand/icon@2x.png
          git rm -r brand_source_chunks
          git commit -m "fix: use supplied logo and crop lucky-bag icon exactly"
          git push origin v1.5.1-fix
