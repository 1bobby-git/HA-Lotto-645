name: Apply Original Lotto Logo

on:
  push:
    branches:
      - v1.5.1-fix
    paths:
      - brand_source_chunks/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5.1-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Reconstruct supplied horizontal PNG
        shell: bash
        run: |
          cat brand_source_chunks/logo.b64.* | tr -d '\n\r' | base64 --decode > images/logo-horizontal.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          path = Path('images/logo-horizontal.png')
          data = path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '0230d546b6986522adabc3d6773f9610770bda2ea3534ee1cf715e84604e987c'
          im = Image.open(path).convert('RGBA')
          assert im.size == (2172, 724), im.size
          print('restored supplied logo losslessly:', im.size)
          PY
      - name: Crop square icon from supplied horizontal logo
        run: python scripts/render_brand.py
      - name: Commit supplied logo and cropped icon assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/logo-horizontal.png images/icon-square.png \
            custom_components/lotto_645/brand/logo.png \
            custom_components/lotto_645/brand/logo@2x.png \
            custom_components/lotto_645/brand/icon.png \
            custom_components/lotto_645/brand/icon@2x.png
          git rm -r brand_source_chunks
          git commit -m "fix: use supplied logo and crop lucky-bag icon exactly"
          git push origin v1.5.1-fix
