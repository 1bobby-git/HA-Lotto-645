name: Apply Runtime Repairs
on:
  push:
    branches: [feat/v1.10.0-fast-results-qr]
    paths: [.github/workflows/apply-runtime-only.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified runtime patch without changing workflows
        run: |
          python - <<'PY'
          import base64,lzma,hashlib,re,subprocess
          from pathlib import Path
          source=Path('.github/workflows/resume-final-checks.yml').read_text()
          encoded=re.search(r"PATCH_XZ: '([^']+)'",source).group(1)
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='01f1e320ac84f9e9a4b4acdde94c7fc340dd6de7173b888425519534c2828ea4'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          # GITHUB_TOKEN cannot edit workflow files. Those changes are applied
          # separately through the user's authorized connector, not this token.
          subprocess.run(['git','restore','--source=HEAD','--worktree','.github/workflows'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components scripts tests
          git diff --cached --check
          git commit -m 'fix: complete fast-result and QR runtime validation'
          git push origin HEAD:feat/v1.10.0-fast-results-qr
      - name: Export public tracked git history only
        run: |
          mkdir -p /tmp/public-lotto-git
          git bundle create /tmp/public-lotto-git/repository.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: public-lotto-git-history
          path: /tmp/public-lotto-git/
          retention-days: 1
