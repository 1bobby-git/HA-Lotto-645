name: Finish Fast Result Validation
on:
  push:
    branches: [feat/v1.10.0-fast-results-qr]
    paths: [.github/workflows/finish-v110.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply reviewed timestamp hardening
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          patch=lzma.decompress(base64.b64decode(Path('.finish-v110.patch.xz.b64').read_text(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='d8a3001e501ae00df565a3462ca8fe1c6833cf566da56ce09647d1341d40655e'
          Path('/tmp/final.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/final.patch'],check=True)
          subprocess.run(['git','apply','/tmp/final.patch'],check=True)
          PY
      - run: python -m pip install -q pytest lunar_python==1.4.8 korean-lunar-calendar==0.4.0 aiohttp
      - run: python -m pytest -q tests/test_fast_results.py tests/test_ticket_qr.py tests/test_result_evaluator.py
      - name: One bounded live publisher check using production client
        run: |
          python - <<'PY'
          import asyncio,importlib,json,types,sys
          from pathlib import Path
          from datetime import UTC,datetime
          for name,path in [('custom_components',Path('custom_components')),('custom_components.lotto_645',Path('custom_components/lotto_645'))]:
              module=types.ModuleType(name);module.__path__=[str(path)];sys.modules[name]=module
          from aiohttp import ClientSession
          from custom_components.lotto_645.fast_results import FastResultClient
          from custom_components.lotto_645.published_results import current_draw_round
          async def main():
              async with ClientSession() as session:
                  now=datetime.now(UTC)
                  result=await FastResultClient(session).check(current_draw_round(now),now=now)
                  print(json.dumps(result,ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
      - name: Commit code only; workflow cleanup is a separate authorized connector write
        run: |
          rm .finish-v110.patch.xz.b64
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components tests scripts docs .finish-v110.patch.xz.b64
          git commit -m 'fix: preserve pre-draw predictions across all result paths'
          git push origin HEAD:feat/v1.10.0-fast-results-qr
