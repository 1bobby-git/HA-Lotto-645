name: Complete session changes
on:
  push:
    branches: [fix/session-completion-1.15.0]
    paths: [.github/workflows/complete-session.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == '1bobby-git/HA-Lotto-645' && github.ref == 'refs/heads/fix/session-completion-1.15.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-completion-1.15.0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply reviewed plaintext source migrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c "import json;print(json.load(open('custom_components/lotto_645/manifest.json'))['version'])")" = '1.14.0'
          python .github/session_apply_1.py
          python .github/session_apply_2.py
          python .github/session_apply_3.py
          git diff --check
      - name: Test all Python regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest 'lunar_python==1.4.8' 'korean-lunar-calendar==0.4.0'
          python -m compileall -q custom_components/lotto_645 scripts
          python -m pytest -q | tee /tmp/session-pytest.log
      - name: Test actual Chromium layout and requests
        shell: bash
        env:
          LOTTO_SCREENSHOT_DIR: /tmp/session-screenshots
        run: |
          set -euo pipefail
          python -m pip install -q playwright 'qrcode[pil]'
          python -m playwright install --with-deps chromium
          python scripts/smoke_ticket_panel.py | tee /tmp/session-browser.log
      - name: Commit verified sources to this feature branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/session_apply_1.py .github/session_apply_2.py .github/session_apply_3.py .github/workflows/complete-session.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete seedless validation, formula cleanup and match layout v1.15.0'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/session-completion-1.15.0
          git rev-parse HEAD
          git archive --format=zip HEAD -o /tmp/session-verified-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-test-evidence
          retention-days: 3
          path: |
            /tmp/session-pytest.log
            /tmp/session-browser.log
            /tmp/session-screenshots
            /tmp/session-verified-source.zip
