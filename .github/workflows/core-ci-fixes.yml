name: Apply Core CI fixes
on:
  push:
    branches: ['feat/core-separation-1.21.0']
    paths: ['.github/workflows/core-ci-fixes.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact reviewed edits (application files only)
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          expected = {'tests/test_core_contract.py': '1431f88f274c09e90141a35bbb3a6bc0baae53a55f9b6ffd632cd3c8694ad974', 'tests/test_feature_removal.py': '4b3d879e47ca3390e9c2e6635e8a1fecbbf0eb69e92c43f104b74af433b9b350', 'tests/test_panel_live_payload.py': 'd1f992b500b23346c94a5386350c1fa56d1195db272961678225e56ce4d0be4a', 'scripts/build_core.py': '64cb675456c2bce818037e79cb4743cf70e37ff51a7343bee7decf4aa46b592b', 'custom_components/lotto_645/ticket_panel.py': 'd2e40f4796e61bd2932003eb549904dcbc50b57f40da714c0eef151729477c9e', 'custom_components/lotto_645/www/lotto-panel-view.js': 'baff323d871e82fe45f4993a9ab2b0d11aef2ba2fcf2a6e43056ade506526798'}
          for f in expected:
              p=Path(f);s=p.read_text(encoding='utf-8')
              if f.endswith('.py'):s=s.replace('.read_text()', '.read_text(encoding="utf-8")')
              if f.endswith('ticket_panel.py'):
                  s=s.replace(".get('name') == 'lotto-ticket-panel':", ".get('name') in {'lotto-ticket-panel', PANEL_TAG}:")
              if f.endswith('lotto-panel-view.js'):
                  nav='<div class="wrap"><div class="main-tabs" role="tablist" aria-label="로또 관리 화면">'
                  for i,(key,label) in enumerate([('home','한눈에'),('wallet','내 복권'),('review','추천 리뷰')]):
                      nav+=f'<button id="tab-{key}" type="button" role="tab" aria-selected="{str(i==0).lower()}" aria-controls="screen-{key}" tabindex="{0 if i==0 else -1}" data-screen="{key}">{label}</button>'
                  nav+='</div></div>'
                  assert 'id="tab-home"' not in s
                  s=s.replace('  </header>\n  <main class="wrap">','    '+nav+'\n  </header>\n  <main class="wrap">',1)
              if f.endswith('test_feature_removal.py'):
                  s=s.replace("assert 'tab-validation' not in source and 'current-recommendations' in source", "assert 'tab-validation' not in source and 'current-recommendations' in source\n    for name in ('home','wallet','review'):\n        assert f'id=\"tab-{name}\"' in source and f'aria-controls=\"screen-{name}\"' in source")
              p.write_text(s,encoding='utf-8')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==expected[f],f
          subprocess.run(['git','add',*expected],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Commit application fixes to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name '1bobby-git'
          git config user.email '66291955+1bobby-git@users.noreply.github.com'
          git commit -m 'fix: retain current panel tabs and lifecycle; use explicit UTF-8 in Core checks'
          gh auth setup-git
          git push origin HEAD:refs/heads/feat/core-separation-1.21.0
