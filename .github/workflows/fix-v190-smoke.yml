name: Fix v1.9 Smoke
on:
  push:
    branches: [feat/v1.9.0-purchased-ticket-results]
    paths: [.github/workflows/fix-v190-smoke.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix isolated package smoke schedule assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke_ha_options.py')
          s=p.read_text()
          s=s.replace('import asyncio\n', 'import asyncio\nimport ast\n', 1)
          s=s.replace("init_module=importlib.import_module('custom_components.lotto_645')\n", '')
          old="    assert init_module._RESULT_CHECKS_UTC == ((5,11,55),(5,12,20),(5,12,50),(5,13,30),(5,14,0),(6,0,40))\n"
          new='''    init_tree=ast.parse((ROOT/'custom_components/lotto_645/__init__.py').read_text())\n    schedule=next(ast.literal_eval(node.value) for node in init_tree.body if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='_RESULT_CHECKS_UTC' for target in node.targets))\n    assert schedule == ((5,11,55),(5,12,20),(5,12,50),(5,13,30),(5,14,0),(6,0,40))\n'''
          if old not in s:
              raise SystemExit('schedule smoke anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          python -m compileall -q scripts
          git diff --check
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-v190-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: validate automatic result schedule without importing package stub'
          git push
