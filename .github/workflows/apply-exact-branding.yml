name: Apply Exact User Branding
on:
  push:
    branches: [fix/v1.9.1-exact-branding-final]
    paths: ['.brand-upload/READY']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.9.1-exact-branding-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore exact user-supplied horizontal PNG
        shell: bash
        run: |
          cat .brand-upload/logo.b64.* | base64 --decode > images/logo-horizontal.png
          echo '0fe12c375a418c2bb51d5729526c4c65da70f82f5afecb4ae9ab8f60fe1b2a37  images/logo-horizontal.png' | sha256sum --check --strict
      - name: Crop only the left icon and apply HA brand variants
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
          python scripts/render_brand.py
      - name: Bump v1.9.1 and remove temporary transfer files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('custom_components/lotto_645/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '1.9.1'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          const = Path('custom_components/lotto_645/const.py')
          const.write_text(const.read_text().replace('VERSION = "1.9.0"', 'VERSION = "1.9.1"'))
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '''\n## 1.9.1\n\n- 사용자가 첨부한 2048×682 가로 PNG를 재그리기·색상변환 없이 그대로 `images/logo-horizontal.png`로 적용.\n- 정사각 아이콘은 동일 원본의 좌측 복주머니+6/45 영역만 정확히 크롭하고 투명 정사각 캔버스에 중앙 정렬.\n- Home Assistant 실제 `brand/logo.png`와 `brand/icon.png`는 해당 두 자산의 규격 맞춤 리사이즈만 사용.\n- 브랜드 검증에서 원본 SHA-256과 2048×682 크기, 정사각 크롭 550×550을 확인.\n\n'''
          if '## 1.9.1' not in text:
              changelog.write_text(text.replace('# Changelog\n', '# Changelog\n' + entry, 1))
          PY
          git rm -r .brand-upload .github/workflows/apply-exact-branding.yml
      - name: Commit v1.9.1 branding fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/logo-horizontal.png images/icon-square.png custom_components/lotto_645/brand/logo.png custom_components/lotto_645/brand/icon.png scripts/render_brand.py custom_components/lotto_645/manifest.json custom_components/lotto_645/const.py CHANGELOG.md
          git commit -m 'fix: apply exact user-supplied Lotto branding (v1.9.1)'
          git push origin HEAD:fix/v1.9.1-exact-branding-final
