name: Apply Exact User Branding
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.9.1-exact-branding-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Validate branding sources and variants
        run: python scripts/render_brand.py
      - name: Commit generated brand variants if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/logo-horizontal.png images/icon-square.png custom_components/lotto_645/brand/logo.png custom_components/lotto_645/brand/icon.png
          if git diff --cached --quiet; then
            echo 'No branding changes to commit'
          else
            git commit -m 'fix: apply exact supplied Lotto branding assets'
            git push origin HEAD:fix/v1.9.1-exact-branding-final
          fi
