name: Apply Exact User Branding
on:
  push:
    branches: [fix/v1.9.1-exact-branding-final]
    paths: ['.brand-upload/READY']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.9.1-exact-branding-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore supplied horizontal artwork
        shell: bash
        run: |
          base64 --decode .brand-upload/logo384.b64 > images/logo-horizontal.png
          echo 'd970376a271555cc6654f4daff640c1d9522a8809c077991df5c4ff476585f49  images/logo-horizontal.png' | sha256sum --check --strict
      - name: Crop only the left icon and apply both assets to Home Assistant
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          logo = Path('images/logo-horizontal.png')
          icon_path = Path('images/icon-square.png')
          brand = Path('custom_components/lotto_645/brand')
          with Image.open(logo) as opened:
              source = opened.convert('RGBA')
          if source.size != (384, 128):
              raise SystemExit(f'unexpected logo size: {source.size}')
          # Proportional crop of the left lucky-bag + 6/45 component from the
          # exact artwork. The horizontal image itself is not cropped or redrawn.
          raw = source.crop((5, 20, 108, 109))
          side = max(raw.size)
          square = Image.new('RGBA', (side, side), (0, 0, 0, 0))
          square.alpha_composite(raw, ((side - raw.width)//2, (side - raw.height)//2))
          icon = square.resize((256, 256), Image.Resampling.LANCZOS)
          icon.save(icon_path, format='PNG', optimize=True, compress_level=9)
          brand.mkdir(parents=True, exist_ok=True)
          (brand/'logo.png').write_bytes(logo.read_bytes())
          (brand/'icon.png').write_bytes(icon_path.read_bytes())
          PY
          python scripts/render_brand.py
      - name: Bump v1.9.1 and remove temporary transfer files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('custom_components/lotto_645/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '1.9.1'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          const = Path('custom_components/lotto_645/const.py')
          const.write_text(const.read_text().replace('VERSION = "1.9.0"', 'VERSION = "1.9.1"'))
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '''\n## 1.9.1\n\n- 사용자가 첨부한 가로 로고를 재그리기·색상변환 없이 비율 유지 규격화하여 가로 로고로 적용.\n- 정사각 아이콘은 동일 로고의 좌측 복주머니+6/45 영역만 크롭하여 적용.\n- `images/`와 Home Assistant 실제 `brand/` 자산을 같은 두 이미지로 통일.\n- 브랜드 검증 스크립트가 다른 이미지로 되돌아가는 것을 방지하도록 SHA-256과 크기를 검증.\n\n'''
          if '## 1.9.1' not in text:
              changelog.write_text(text.replace('# Changelog\n', '# Changelog\n' + entry, 1))
          PY
          git rm -r .brand-upload .github/workflows/apply-exact-branding.yml
      - name: Commit v1.9.1 branding fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/logo-horizontal.png images/icon-square.png custom_components/lotto_645/brand/logo.png custom_components/lotto_645/brand/icon.png scripts/render_brand.py custom_components/lotto_645/manifest.json custom_components/lotto_645/const.py CHANGELOG.md
          git commit -m 'fix: apply supplied Lotto branding exactly (v1.9.1)'
          git push origin HEAD:fix/v1.9.1-exact-branding-final
