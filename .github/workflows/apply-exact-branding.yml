name: Apply Exact User Branding
on:
  push:
    branches: [fix/v1.9.1-exact-branding-final]
    paths: ['.brand-upload/READY']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.9.1-exact-branding-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore user-supplied horizontal artwork
        shell: bash
        run: |
          cat .brand-upload/logo768.b64.* | base64 --decode > images/logo-horizontal.png
          echo 'fc220ddd9a82111dc3a620562090e884f1ee9e697421a3257db734bf206b688a  images/logo-horizontal.png' | sha256sum --check --strict
      - name: Crop only the left icon and apply actual HA brand files
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
          python scripts/render_brand.py
      - name: Bump v1.9.1 and remove temporary transfer files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('custom_components/lotto_645/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '1.9.1'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          const = Path('custom_components/lotto_645/const.py')
          const.write_text(const.read_text().replace('VERSION = "1.9.0"', 'VERSION = "1.9.1"'))
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '''\n## 1.9.1\n\n- 사용자가 첨부한 가로 로고를 재그리기·색상변환·팔레트 양자화 없이 원본 비율 그대로 해상도만 768×256으로 규격화하여 적용.\n- 정사각 아이콘은 동일 가로 로고의 좌측 복주머니+6/45 영역만 크롭하여 256×256으로 적용.\n- `images/logo-horizontal.png`와 실제 HA `brand/logo.png`, `images/icon-square.png`와 실제 HA `brand/icon.png`를 각각 동일 바이트로 통일.\n- 브랜드 검증에서 가로 로고 SHA-256/크기와 좌측 크롭 크기를 확인해 다른 이미지로 회귀하지 않도록 고정.\n\n'''
          if '## 1.9.1' not in text:
              changelog.write_text(text.replace('# Changelog\n', '# Changelog\n' + entry, 1))
          PY
          git rm -r .brand-upload .github/workflows/apply-exact-branding.yml
      - name: Commit v1.9.1 branding fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/logo-horizontal.png images/icon-square.png custom_components/lotto_645/brand/logo.png custom_components/lotto_645/brand/icon.png scripts/render_brand.py custom_components/lotto_645/manifest.json custom_components/lotto_645/const.py CHANGELOG.md
          git commit -m 'fix: apply user-supplied Lotto branding (v1.9.1)'
          git push origin HEAD:fix/v1.9.1-exact-branding-final
