name: Apply validation hot-upgrade patch

on:
  push:
    branches: [fix/validation-hot-upgrade-v1.18.1]
    paths: [.github/workflows/apply-validation-hot-upgrade.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validation-hot-upgrade-v1.18.1
      - name: Apply v1.18.1 hot-upgrade fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Release version.
          replace_once('custom_components/lotto_645/const.py', 'VERSION = "1.18.0"', 'VERSION = "1.18.1"')
          replace_once('custom_components/lotto_645/manifest.json', '"version": "1.18.0"', '"version": "1.18.1"')

          # Force the production shell to re-evaluate after HACS/HA updates.
          p = Path('custom_components/lotto_645/www/lotto-panel-shell.js')
          text = p.read_text()
          if '1.18.0' not in text:
              raise SystemExit('lotto-panel-shell.js: expected v1.18.0 markers')
          p.write_text(text.replace('1.18.0', '1.18.1'))

          # Replace stale historical-validation controller instances on a live panel.
          p = Path('custom_components/lotto_645/www/lotto-panel-validation.js')
          text = p.read_text()
          text = text.replace("./lotto-panel-validation-details.js?v=1.17.1", "./lotto-panel-validation-details.js?v=1.18.1", 1)
          needle = "const AI = 'home_assistant_ai';\n"
          if needle not in text:
              raise SystemExit('validation.js: AI constant marker missing')
          text = text.replace(needle, needle + "const VALIDATION_UI_VERSION = '1.18.1';\n", 1)
          constructor_old = "    this.restoreToken=0;this.restoreTimer=null;this.busy=false;this.importing=false;this.importToken=0;this.sort='points';this.expandedMethods=new Set();this.detailLimits=new Map();this.detailCycle=null;"
          constructor_new = constructor_old + "this.runtimeVersion=VALIDATION_UI_VERSION;"
          if text.count(constructor_old) != 1:
              raise SystemExit('validation.js: constructor marker mismatch')
          text = text.replace(constructor_old, constructor_new, 1)
          old = "  let style=panel.shadowRoot.querySelector('style[data-lotto-validation]');if(!style){style=el('style');panel.shadowRoot.append(style);}style.dataset.lottoValidation='1.17.1';style.textContent=STYLE;\n  if(panel._historicalValidation&&panel._historicalValidation.form!==panel.node('validation-form')){panel._historicalValidation.sequence++;panel._historicalValidation.restoreToken++;clearTimeout(panel._historicalValidation.restoreTimer);panel._historicalValidation=null;}\n  if(!panel._historicalValidation)panel._historicalValidation=new HistoricalValidationView(panel);"
          new = "  let style=panel.shadowRoot.querySelector('style[data-lotto-validation]');if(!style){style=el('style');panel.shadowRoot.append(style);}style.dataset.lottoValidation=VALIDATION_UI_VERSION;style.textContent=STYLE;\n  const current=panel._historicalValidation;\n  const needsUpgrade=current&&(current.form!==panel.node('validation-form')||current.runtimeVersion!==VALIDATION_UI_VERSION);\n  if(needsUpgrade){\n    current.sequence=(current.sequence||0)+1;current.restoreToken=(current.restoreToken||0)+1;clearTimeout(current.restoreTimer);\n    if('importToken' in current)current.importToken=(current.importToken||0)+1;\n    panel._historicalValidation=null;\n  }\n  if(!panel._historicalValidation)panel._historicalValidation=new HistoricalValidationView(panel);"
          if text.count(old) != 1:
              raise SystemExit('validation.js: applyHistoricalValidation marker mismatch')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Browser regression: a controller retained from the previous release must be replaced.
          p = Path('scripts/smoke_panel_validation.py')
          text = p.read_text()
          text = text.replace("component_version:'1.17.1'", "component_version:'1.18.1'", 1)
          text = text.replace("lotto-panel-validation.js?v=1.17.1", "lotto-panel-validation.js?v=1.18.1", 1)
          marker = "    await page.evaluate('el._clearSmartSync()')\n    print('PASS: unified compact ranks, 10 theme/width combinations, >=4.5 contrast, reset, consent/cancel, review provenance, CSV, stale-entry and error recovery')"
          replacement = "    await page.evaluate('el._clearSmartSync()')\n    assert await page.evaluate('''async()=>{\n      const m=await import('/lotto_645_static/lotto-panel-validation.js?v=1.18.1');\n      const stale=el._historicalValidation;\n      stale.runtimeVersion='1.18.0';\n      m.applyHistoricalValidation(el);\n      return el._historicalValidation!==stale\n        && el._historicalValidation.runtimeVersion==='1.18.1'\n        && el._historicalValidation.form===el.node('validation-form');\n    }''')\n    await page.wait_for_timeout(20)\n    print('PASS: unified compact ranks, hot-upgrade controller replacement, 10 theme/width combinations, >=4.5 contrast, reset, consent/cancel, review provenance, CSV, stale-entry and error recovery')"
          if text.count(marker) != 1:
              raise SystemExit('smoke_panel_validation.py: end marker mismatch')
          p.write_text(text.replace(marker, replacement, 1))

          # Version-alignment regression now also covers the live validation controller marker.
          p = Path('tests/test_version_v1_16.py')
          text = p.read_text()
          marker = "    assert f'lotto-panel-validation.js?v={version}' in shell\n"
          replacement = marker + "    validation = (root / 'www/lotto-panel-validation.js').read_text()\n    assert f\"VALIDATION_UI_VERSION = '{version}'\" in validation\n"
          if text.count(marker) != 1:
              raise SystemExit('test_version_v1_16.py: version marker mismatch')
          p.write_text(text.replace(marker, replacement, 1))

          # User-visible release note.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          section = "## 1.18.1 — 2026-09-15\n\n- 테스트용 번호 화면과 실제 HA 화면이 달라질 수 있던 라이브 업데이트 문제를 수정했습니다. 이전 버전의 과거검증 컨트롤러가 남아 있으면 새 버전 컨트롤러로 즉시 교체해 전체 너비 상세·적중 이력·0점 배경 규칙을 동일하게 적용합니다.\n- 패널/검증 모듈 캐시 버전을 1.18.1로 올려 HACS 업데이트 뒤에도 새 UI 코드를 확실히 다시 불러옵니다.\n- 브라우저 회귀 테스트에 이전 버전 컨트롤러를 강제로 남긴 상태의 업그레이드 시나리오를 추가했습니다.\n\n"
          if section not in text:
              if not text.startswith('# Changelog\n\n'):
                  raise SystemExit('CHANGELOG.md: heading mismatch')
              changelog.write_text(text.replace('# Changelog\n\n', '# Changelog\n\n' + section, 1))

          Path('CHANGELOG_v1.18.1.md').write_text(
              '# v1.18.1 — 실제 HA 화면 핫업데이트 정합성\n\n'
              '- 테스트용 번호로 확인한 과거검증 화면과 실제 배포 화면이 동일한 컨트롤러/스타일을 사용하도록 수정했습니다.\n'
              '- 브라우저에 이전 릴리스의 과거검증 컨트롤러가 남아 있어도 버전 불일치를 감지해 즉시 교체하고 서버의 최신 검증 상태를 다시 복원합니다.\n'
              '- 패널 및 검증 ES 모듈 캐시 키를 1.18.1로 갱신하고 핫업그레이드 회귀 테스트를 추가했습니다.\n'
          )

          # This workflow is one-shot and must not remain in the product branch.
          Path('.github/workflows/apply-validation-hot-upgrade.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refresh validation UI controller on live upgrades v1.18.1'
          git push origin HEAD:fix/validation-hot-upgrade-v1.18.1
